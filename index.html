<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhy | Developer Links</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Animated Blobs -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="container">
        <!-- Top Action / Theme Toggle -->
        <header class="top-nav">
            <button class="icon-btn" aria-label="Share">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </button>
        </header>

        <!-- Profile Section -->
        <section class="profile-header">
            <div class="avatar-wrapper">
                <img src="pp.jpeg" alt="Adhy" class="avatar">
            </div>
            <h1 class="name">Adhy</h1>
            <p class="badge">Developer & Network Admin</p>
            <p class="bio">Building scalable systems and modern web interfaces. Explore my recent work below.</p>
            
            <div class="social-links">
                <a href="https://github.com/dhyzxx" class="social-icon"><i class="fa-brands fa-github"></i></a>
                <a href="https://instagram.com/adhy.png" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="social-icon"><i class="fa-solid fa-envelope"></i></a>
            </div>
        </section>

        <!-- Links Section -->
        <main class="links-wrapper">
            
            <!-- Link 1: PDAM System -->
            <a href="https://pdam.adiow.my.id" class="modern-card group">
                <div class="card-icon bg-gradient-blue">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <div class="card-content">
                    <h2 class="card-title">PDAM Billing System</h2>
                    <p class="card-subtitle">Laravel, MySQL, Payment Gateway</p>
                </div>
                <div class="card-action">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Link 2: Portfolio -->
            <a href="profile/index.html" class="modern-card group">
                <div class="card-icon bg-gradient-purple">
                    <i class="fa-solid fa-laptop-code"></i>
                </div>
                <div class="card-content">
                    <h2 class="card-title">Web Portfolio</h2>
                    <p class="card-subtitle">HTML, CSS, ReactJS</p>
                </div>
                <div class="card-action">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

        </main>
        
        <footer class="footer">
            <p>Built with <i class="fa-solid fa-heart" style="color: #ef4444;"></i> by Adhy</p>
        </footer>
    </div>
</body>
</html>
